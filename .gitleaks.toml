title = "commands gitleaks policy"

[extend]
useDefault = true

[[rules]]
id = "local-system-paths"
description = "Do not commit local absolute system paths in this public-ready repository."
regex = '''(/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Za-z]:\\+[Uu][Ss][Ee][Rr][Ss]\\+[A-Za-z0-9._-]+)'''
tags = ["policy", "privacy"]

[[rules.allowlists]]
description = "Allow a match only when the whole match is a placeholder path. Other paths on the same line are still reported."
regexTarget = "secret"
regexes = [
  '''^(/Users/(YOU|USER|username)|/home/(user|USER|username)|[A-Za-z]:\\+[Uu][Ss][Ee][Rr][Ss]\\+(YOU|USER|USERNAME|username))$'''
]
