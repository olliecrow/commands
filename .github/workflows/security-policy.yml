name: Checks

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tools are downloaded, checked against a pinned SHA-256, and unpacked
      # outside the checkout.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          version="0.11.0"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          base_url="https://github.com/koalaman/shellcheck/releases/download/v${version}"
          expected_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          workdir="${RUNNER_TEMP}/shellcheck-install"
          mkdir -p "${workdir}" "${RUNNER_TEMP}/bin"
          cd "${workdir}"
          curl -sSfL -o "${archive}" "${base_url}/${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum -c -
          tar -xJf "${archive}"
          install -m 0755 "shellcheck-v${version}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/security/*.sh tests/*.sh completions/commands.bash

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          workdir="${RUNNER_TEMP}/gitleaks-install"
          mkdir -p "${workdir}" "${RUNNER_TEMP}/bin"
          cd "${workdir}"
          curl -sSfL -o "${archive}" "${base_url}/${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          install -m 0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Run script tests
        env:
          COMMANDS_TEST_REQUIRE_GITLEAKS: "1"
        run: bash tests/run.sh

      - name: Resolve the commit range to scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            from="${PR_BASE_SHA}"
            to="${PR_HEAD_SHA}"
          else
            from="${PUSH_BEFORE_SHA}"
            to="${GITHUB_SHA}"
            # A missing, all-zero, or unknown base means: scan all history.
            if [[ -z "$from" ]] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
              from="0000000000000000000000000000000000000000"
            fi
          fi
          printf 'SCAN_FROM=%s\nSCAN_TO=%s\n' "$from" "$to" >>"$GITHUB_ENV"

      # The wrapper fails when gitleaks logs an error or scans too few commits.
      - name: Scan the commit range with gitleaks
        run: bash scripts/security/gitleaks-range.sh --from "${SCAN_FROM}" --to "${SCAN_TO}"

      - name: Check commit messages and added lines in the range
        run: bash scripts/security/check-push-range.sh --from "${SCAN_FROM}" --to "${SCAN_TO}"

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
